[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ludex-couchplay"
version = "0.1.0"
description = "ludex plugin: play a game in split-screen with CouchPlay"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []  # ludex (>=0.65.0, for plugin `actions`) is the host and provides `ludex.plugins`

[project.optional-dependencies]
test = ["pytest>=8"]
overlay = ["PySide6-Essentials==6.12.0"]  # only the controller overlay needs Qt; the agent is stdlib

[project.scripts]
ludex-lan = "ludex_lan.cli:main"
ludex-lan-overlay = "ludex_lan.overlay:main"

[project.entry-points."ludex.providers"]
couchplay = "ludex_couchplay:PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["src/ludex_couchplay", "src/ludex_lan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
